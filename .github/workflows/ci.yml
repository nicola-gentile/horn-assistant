name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        shell: bash
        run: ./mvnw -B verify

      - name: Golden and CLI tests against the jar
        shell: bash
        run: ./mvnw -B test -Dtest='GoldenTest,ErrorCasesTest,CliTest' -Dhorn.exe='java -jar target/horn-assistant.jar'

  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native image (runs the JVM and native test suites)
        shell: bash
        run: ./mvnw -B -Pnative package

      - name: Golden and CLI tests against the native binary
        shell: bash
        run: ./mvnw -B test -Dtest='GoldenTest,ErrorCasesTest,CliTest' -Dhorn.exe=target/horn-assistant

      - name: Smoke run
        shell: bash
        run: |
          ./target/horn-assistant --version
          ./target/horn-assistant src/test/resources/golden/g1.smt2
