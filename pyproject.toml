[project]
name = "horn-assistant"
version = "0.1.0"
description = "A CHC solver agnostic preprocessor implementing transformations of Constrained Horn Clause systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nicola Gentile", email = "nicola.gentile.developer@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# pychc is not published on PyPI: it is referenced directly from GitHub so that
# `pip install git+https://github.com/nicola-gentile/horn-assistant` resolves it too.
dependencies = [
    "networkx>=3.7",
    "pychc @ git+https://github.com/usi-verification-and-security/pychc",
    "pysmt>=0.9.7.dev485",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/nicola-gentile/horn-assistant"
Repository = "https://github.com/nicola-gentile/horn-assistant"
Issues = "https://github.com/nicola-gentile/horn-assistant/issues"

[project.scripts]
horn-assistant = "horn_assistant.cli:app"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Kept separate from `dev` because mypy does not build on PyPy.
typing = [
    "mypy>=2.3.1",
    "types-networkx",
]

[tool.uv]
default-groups = ["dev", "typing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true

[[tool.mypy.overrides]]
module = ["pychc.*", "pysmt.*"]
ignore_missing_imports = true
