# Native Image configuration of horn-assistant, picked up automatically from the class path.
#
# The image-wide build arguments (--no-fallback, -march=compatibility, -H:+ReportExceptionStackTraces)
# are set in the `native` Maven profile. No --initialize-at-build-time is needed: the program has no
# expensive static state, so the default (run-time initialisation) is kept.
#
# Reachability metadata:
#  - picocli: generated at compile time by picocli-codegen under
#    META-INF/native-image/picocli-generated/dev.hornassistant/horn-assistant/;
#  - ANTLR runtime: no reflection on the code paths used (generated lexer/parser, ATN deserialisation);
#    the GraalVM reachability-metadata repository is enabled in the plugin for anything else;
#  - TamboUI: only tamboui-core's Style/Color/Span/Line/AnsiStringBuilder are used, which need no
#    reflection or ServiceLoader;
#  - resources: reachability-metadata.json in this folder.
